<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Last Call Billiards</title>
<meta name="description" content="Pixel-art roguelike billiards where space is drunk — shots follow geodesics of a warped metric.">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d0a12">
<link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Last Call">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #0d0a12;
    touch-action: none;
    overscroll-behavior: none;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    cursor: crosshair;
  }
  canvas { display: block; image-rendering: pixelated; }

  /* Portrait hint: the table is 16:9, so a turned phone plays far better.
     Dismissible — some people would rather squint than rotate. */
  #rotate {
    position: fixed; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 24px calc(24px + env(safe-area-inset-right)) 24px calc(24px + env(safe-area-inset-left));
    background: #0d0a12; color: #f2ede4; z-index: 10;
    font-family: "Press Start 2P", monospace; text-align: center;
  }
  @media (orientation: portrait) and (max-width: 900px) {
    body:not(.no-rotate-hint) #rotate { display: flex; }
  }
  #rotate .glass { font-size: 44px; animation: tip 2.4s ease-in-out infinite; }
  @keyframes tip { 0%, 100% { transform: rotate(-12deg); } 50% { transform: rotate(12deg); } }
  #rotate h1 { font-size: 13px; margin: 0; color: #f2c230; line-height: 1.8; }
  #rotate p { font-size: 8px; margin: 0; color: #9a917f; line-height: 2; }
  #rotate button {
    font-family: inherit; font-size: 8px; color: #f2ede4;
    background: #1a1522; border: 2px solid #2a2136; border-radius: 4px;
    padding: 12px 18px; cursor: pointer;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="rotate">
  <div class="glass">🍺</div>
  <h1>TURN YOUR PHONE</h1>
  <p>the table is wider than it is tall</p>
  <button id="anyway">PLAY ANYWAY</button>
</div>

<!-- Load order matters: each file only needs the ones above it. -->
<script src="src/config.js"></script>
<script src="src/geometry.js"></script>
<script src="src/physics.js"></script>
<script src="src/audio.js"></script>
<script src="src/table.js"></script>
<script src="src/specials.js"></script>
<script src="src/helpers.js"></script>
<script src="src/shop.js"></script>
<script src="src/render-core.js"></script>
<script src="src/backdrop.js"></script>
<script src="src/render-table.js"></script>
<script src="src/render-ui.js"></script>
<script src="src/game.js"></script>
<script>
  document.getElementById("anyway").addEventListener("click", function () {
    document.body.classList.add("no-rotate-hint");
    window.dispatchEvent(new Event("resize"));
  });

  // Service worker: needs http(s), so a file:// open just skips it.
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
</script>
</body>
</html>
